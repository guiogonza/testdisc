<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🕹️ Retro Games Arcade</title>
<style>
  :root {
    --bg: #0a0a0f;
    --card-bg: #13131e;
    --accent: #ff6b35;
    --accent2: #ffd700;
    --nes: #e74c3c;
    --snes: #9b59b6;
    --coop: #27ae60;
    --versus: #e74c3c;
    --turns: #3498db;
    --text: #e8e8f0;
    --muted: #6a6a8a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Press Start 2P', 'Courier New', monospace;
    min-height: 100vh;
  }

  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

  header {
    background: linear-gradient(135deg, #0a0a0f 0%, #1a0a2e 50%, #0a0a0f 100%);
    border-bottom: 3px solid var(--accent);
    padding: 20px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      90deg,
      transparent,
      transparent 40px,
      rgba(255,107,53,0.03) 40px,
      rgba(255,107,53,0.03) 41px
    );
  }
  header h1 {
    font-size: clamp(18px, 4vw, 36px);
    color: var(--accent2);
    text-shadow: 0 0 20px var(--accent), 0 0 40px var(--accent2);
    letter-spacing: 4px;
    position: relative;
  }
  header p {
    font-size: 8px;
    color: var(--muted);
    margin-top: 8px;
    letter-spacing: 2px;
    position: relative;
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    padding: 20px;
    justify-content: center;
    align-items: center;
    background: rgba(0,0,0,0.4);
    border-bottom: 1px solid #222;
  }

  .filter-group { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .filter-btn {
    font-family: inherit;
    font-size: 8px;
    padding: 8px 14px;
    border: 2px solid #333;
    background: #13131e;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
  .filter-btn.active { border-color: var(--accent2); color: var(--accent2); background: rgba(255,215,0,0.08); }
  .filter-btn.nes  { --c: var(--nes); }
  .filter-btn.snes { --c: var(--snes); }
  .filter-btn.nes.active  { border-color: var(--nes);  color: var(--nes);  background: rgba(231,76,60,0.1); }
  .filter-btn.snes.active { border-color: var(--snes); color: var(--snes); background: rgba(155,89,182,0.1); }
  .filter-btn.coop.active    { border-color: var(--coop);    color: var(--coop); background: rgba(39,174,96,0.1); }
  .filter-btn.versus.active  { border-color: var(--versus);  color: var(--versus); background: rgba(231,76,60,0.1); }
  .filter-btn.turns.active   { border-color: var(--turns);   color: var(--turns); background: rgba(52,152,219,0.1); }

  .sep { width: 2px; height: 30px; background: #222; }

  #search {
    font-family: inherit;
    font-size: 9px;
    padding: 8px 14px;
    border: 2px solid #333;
    background: #13131e;
    color: var(--text);
    outline: none;
    width: 200px;
    letter-spacing: 1px;
  }
  #search:focus { border-color: var(--accent); }

  .count {
    font-size: 8px;
    color: var(--muted);
    padding: 4px 10px;
    border: 1px solid #222;
  }

  main {
    padding: 20px;
    max-width: 1400px;
    margin: 0 auto;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 16px;
  }

  .card {
    background: var(--card-bg);
    border: 2px solid #1e1e30;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
    overflow: hidden;
  }
  .card:hover {
    border-color: var(--accent);
    transform: translateY(-4px);
    box-shadow: 0 8px 24px rgba(255,107,53,0.3);
  }
  .card.hidden { display: none; }

  .card-thumb {
    width: 100%;
    aspect-ratio: 4/3;
    object-fit: cover;
    display: block;
    background: #0d0d18;
    image-rendering: pixelated;
  }
  .card-thumb-placeholder {
    width: 100%;
    aspect-ratio: 4/3;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    background: linear-gradient(135deg, #0d0d18, #1a1a2e);
    color: #333;
  }

  .card-info {
    padding: 10px 8px;
    border-top: 1px solid #1e1e30;
  }
  .card-title {
    font-size: 7px;
    color: var(--text);
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-bottom: 6px;
  }
  .tags { display: flex; gap: 4px; flex-wrap: wrap; }
  .tag {
    font-size: 6px;
    padding: 2px 5px;
    border: 1px solid;
    letter-spacing: 0.5px;
  }
  .tag.nes    { border-color: var(--nes);    color: var(--nes); }
  .tag.snes   { border-color: var(--snes);   color: var(--snes); }
  .tag.coop   { border-color: var(--coop);   color: var(--coop); }
  .tag.versus { border-color: var(--versus); color: var(--versus); }
  .tag.turns  { border-color: var(--turns);  color: var(--turns); }

  .play-overlay {
    position: absolute;
    inset: 0;
    background: rgba(255,107,53,0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    color: #fff;
    letter-spacing: 2px;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .card:hover .play-overlay { opacity: 1; }

  .empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px;
    color: var(--muted);
    font-size: 10px;
    line-height: 2;
  }

  footer {
    text-align: center;
    padding: 20px;
    font-size: 7px;
    color: var(--muted);
    border-top: 1px solid #111;
    margin-top: 20px;
  }
</style>
</head>
<body>

<header>
  <h1>🕹️ RETRO ARCADE</h1>
  <p>NES · SNES · CO-OP · VERSUS · CLÁSICOS</p>
</header>

<div class="controls">
  <div class="filter-group" id="platform-filters">
    <button class="filter-btn active" data-platform="all">TODOS</button>
    <button class="filter-btn nes" data-platform="nes">NES</button>
    <button class="filter-btn snes" data-platform="snes">SNES</button>
  </div>
  <div class="sep"></div>
  <div class="filter-group" id="mode-filters">
    <button class="filter-btn active" data-mode="all">TODOS</button>
    <button class="filter-btn coop" data-mode="coop">CO-OP</button>
    <button class="filter-btn versus" data-mode="versus">VS</button>
    <button class="filter-btn turns" data-mode="turns">POR TURNOS</button>
  </div>
  <div class="sep"></div>
  <input type="text" id="search" placeholder="BUSCAR..." oninput="applyFilters()">
  <div class="count" id="count">0 JUEGOS</div>
</div>

<main>
  <div class="grid" id="grid"></div>
</main>

<footer>INSERT COIN TO PLAY · PRESS START</footer>

const PLATFORM_ICONS = { nes: '🔴', snes: '🟣' };
const MODE_LABELS = { coop: 'CO-OP', versus: 'VS', turns: 'TURNOS' };
const THUMB_BASE = '/retrogames/';

let activePlatform = 'all', activeMode = 'all';

function buildGrid(games) {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  if (!games.length) {
    grid.innerHTML = '<div class="empty">NO SE ENCONTRARON JUEGOS<br><span style="font-size:9px;color:#333">INTENTA OTRO FILTRO</span></div>';
    document.getElementById('count').textContent = '0 JUEGOS';
    return;
  }
  games.forEach(g => {
    const card = document.createElement('div');
    card.className = 'card';
    const core = g.platform === 'nes' ? 'nes' : 'snes9x';
    const playUrl = `play.html?rom=${encodeURIComponent(g.rom)}&core=${core}&name=${encodeURIComponent(g.title)}`;
    const thumbUrl = g.thumb ? THUMB_BASE + g.thumb : null;

    card.innerHTML = `
      ${thumbUrl
        ? `<img class="card-thumb" src="${thumbUrl}" alt="${g.title}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
        : ''}
      <div class="card-thumb-placeholder" style="${thumbUrl ? 'display:none' : ''}">🎮</div>
      <div class="play-overlay">▶ JUGAR</div>
      <div class="card-info">
        <div class="card-title">${g.title}</div>
        <div class="tags">
          <span class="tag ${g.platform}">${PLATFORM_ICONS[g.platform]} ${g.platform.toUpperCase()}</span>
          <span class="tag ${g.mode}">${MODE_LABELS[g.mode]}</span>
        </div>
      </div>
    `;
    card.onclick = () => window.location.href = playUrl;
    grid.appendChild(card);
  });
  document.getElementById('count').textContent = `${games.length} JUEGOS`;
}

function applyFilters() {
  const q = document.getElementById('search').value.toLowerCase();
  const filtered = GAMES.filter(g => {
    const matchPlatform = activePlatform === 'all' || g.platform === activePlatform;
    const matchMode = activeMode === 'all' || g.mode === activeMode;
    const matchSearch = !q || g.title.toLowerCase().includes(q);
    return matchPlatform && matchMode && matchSearch;
  });
  buildGrid(filtered);
}

document.getElementById('platform-filters').addEventListener('click', e => {
  const btn = e.target.closest('[data-platform]');
  if (!btn) return;
  activePlatform = btn.dataset.platform;
  document.querySelectorAll('[data-platform]').forEach(b => b.classList.toggle('active', b === btn));
  applyFilters();
});

document.getElementById('mode-filters').addEventListener('click', e => {
  const btn = e.target.closest('[data-mode]');
  if (!btn) return;
  activeMode = btn.dataset.mode;
  document.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('active', b === btn));
  applyFilters();
});

// Init
applyFilters();
</script>
