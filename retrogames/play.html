<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">🕹️ Retro Arcade</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    color: #fff;
    font-family: 'Courier New', monospace;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }
  #topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 16px;
    background: #0a0a0f;
    border-bottom: 2px solid #ff6b35;
    flex-shrink: 0;
  }
  #back-btn {
    font-family: inherit;
    font-size: 11px;
    padding: 6px 14px;
    background: #1a1a2e;
    color: #ff6b35;
    border: 2px solid #ff6b35;
    cursor: pointer;
    letter-spacing: 1px;
    text-decoration: none;
    transition: all 0.15s;
  }
  #back-btn:hover { background: #ff6b35; color: #000; }
  #game-title {
    font-size: 13px;
    color: #ffd700;
    letter-spacing: 2px;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #fullscreen-btn {
    font-family: inherit;
    font-size: 11px;
    padding: 6px 14px;
    background: #13131e;
    color: #aaa;
    border: 2px solid #333;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.15s;
  }
  #fullscreen-btn:hover { border-color: #ffd700; color: #ffd700; }
  #game-container {
    flex: 1;
    position: relative;
    background: #000;
    overflow: hidden;
  }
  #game {
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>

<div id="topbar">
  <a href="/games/" id="back-btn">◀ VOLVER</a>
  <div id="game-title">CARGANDO...</div>
  <button id="fullscreen-btn" onclick="toggleFullscreen()">⛶ PANTALLA COMPLETA</button>
</div>

<div id="game-container">
  <div id="game"></div>
</div>

<script>
  const params = new URLSearchParams(location.search);
  const rom  = params.get('rom')  || '';
  const core = params.get('core') || 'nes';
  const name = params.get('name') || 'Retro Game';

  document.getElementById('game-title').textContent = name.toUpperCase();
  document.getElementById('page-title').textContent = '🕹️ ' + name;

  // EmulatorJS config — must be set BEFORE loading loader.js
  window.EJS_player      = '#game';
  window.EJS_gameUrl     = '/retrogames/' + rom;
  window.EJS_core        = core;
  window.EJS_pathtodata  = 'https://cdn.emulatorjs.org/stable/data/';
  window.EJS_gameName    = name;
  window.EJS_startOnLoaded = true;
  window.EJS_language    = 'es';
  window.EJS_color       = '#ff6b35';

  const s = document.createElement('script');
  s.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
  document.body.appendChild(s);

  function toggleFullscreen() {
    const el = document.getElementById('game-container');
    if (!document.fullscreenElement) {
      el.requestFullscreen().catch(() => {});
    } else {
      document.exitFullscreen();
    }
  }
</script>
</body>
</html>
